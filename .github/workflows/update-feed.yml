name: Update latest articles

on:
  schedule:
    - cron: "23 */3 * * *" # every 3 hours, on the clock in UTC
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: # also re-stamps the CSS/JS version tags when those files change
      - scripts/update_feed.py
      - .github/workflows/update-feed.yml
      - assets/css/**
      - assets/js/**

permissions:
  contents: write
  pages: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest articles
        run: python3 scripts/update_feed.py

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html data/feed.json
          git commit -m "Update latest articles"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
